<meta name="description" content="大家好！多謝渣打銀行邀請我出席今天的「防騙影院」開幕儀式。很高興看到銀行業界繼續以不同的方式，將防騙教育帶進社區。
看電影是不少市民喜歡的娛樂。騙案其實也是電影，不過是以糖衣包裝的恐怖片，跌入詐騙陷阱的主角，不像拍戲可以「NG」，過數給騙徒後也沒有「Take 2」，一旦「中招」，後果不堪設想。
香港人因為詐騙一共損失了多少錢？去年是81億港元，今年首八個月已超過52億港元。52億損失是甚麼概念？">
