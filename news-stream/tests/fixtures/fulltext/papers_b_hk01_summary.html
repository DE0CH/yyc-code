<html><head><meta content="福岡｜聖誕市集｜日本旅遊｜每逢到冬季，九州福岡就會迎來年度冬日盛事Christmas Advent，由博多、天神一路延伸至西中洲、百道濱，市內多個地點同" property="og:description"/></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"article": {"blocks": [{"blockType": "text", "htmlTokens": [[{"type": "boldLink", "content": "👉follow 好食玩飛ig ✈️免費睇旅遊飲食攻略", "link": "https://www.instagram.com/01travelandfood/", "theme": {"themeId": "64869c9d984e64517a18d05f", "dark": {"fontColor": "#CA87FF", "backgroundColor": "#493559"}, "light": {"fontColor": "#8F00FF", "backgroundColor": "#EED9FF"}}}]]}, {"blockType": "text", "htmlTokens": [[{"type": "h2", "content": "福岡聖誕市集2026【1】光之街博多聖誕市集——博多站前經典會場"}], [{"type": "text", "content": "光之街博多聖誕市集作為福岡聖誕盛會的代表性會場，在博多站前廣場鋪滿亮麗光影。純白木屋攤位（Hütte）一字排開，售賣德國烤香腸、歐洲進口聖誕雜貨與手工藝品。空氣中瀰漫著熱葡萄酒與美食濃香，一出站即可感受濃濃節慶氣氛！"}]]}, {"blockType": "text", "htmlTokens": [[{"type": "h3", "content": "光之街博多聖誕市集｜購買指定熱飲連限定馬克杯帶走"}], [{"type": "text", "content": "這款限量版馬克杯為今年博多會場專屬款式，清爽的綠色設計與車站前燈火通明的璀璨景致相映成趣。大家只要在會場內購買熱紅酒或熱可可，即可獲贈/連杯購買，數量有限，售完即止。"}]]}, {"blockType": "summary", "summary": ["光之街博多聖誕市集", "地址：福岡市博多區博多站中央街1‑1（JR 博多站前廣場）", "日期：2026年11月7日‑12月25日", "營業時間：平日16:00‑23:00；週末及公眾假期12:00‑23:00", "*11月7日（週六）營業時間為16:00-23:00（最後點餐時間 22:45） *12月24日（週四）及12月25日（週五）營業時間為12:00-23:00（最後點餐時間 22:45）", "交通：JR或福岡市地下鐵「博多站」出站即達", "適合：抵埗順道逛市集、初體驗聖誕市集"]}, {"blockType": "text", "htmlTokens": [[{"type": "h2", "content": "福岡聖誕市集2026【2】TENJIN CHRISTMAS ADVENT（天神聖誕市集）——天神核心人氣會場"}], [{"type": "text", "content": "TENJIN CHRISTMAS ADVENT位於天神心臟地帶的福岡市役所西側交流廣場，會場設有巨型光之拱門及聖誕樹，是全城人氣最高的聖誕聚集地，遊人眾多。限定馬克杯以柔和粉紅色為主，印有角色裝飾聖誕樹的可愛畫面，打卡買手信兩相宜。大家出發前要留意，11月28日至29日將暫停營業。"}]]}, {"blockType": "text", "htmlTokens": [[{"type": "h3", "content": "天神光之森林｜限量版馬克杯"}], [{"type": "text", "content": "此款為天神交流廣場專屬限定粉紅馬克杯，杯身描繪聖誕老人與雪人歡度佳節的生動插畫，現場購買熱熱的香料熱紅酒（Glühwein）或無酒精可可即可一同帶走收藏。"}]]}, {"blockType": "summary", "summary": ["地址：福岡市中央區天神1-8-1（福岡市役所西側交流廣場）", "日期：2026年11月14日‑12月26日", "營業時間：平日17:00‑23:00；週末及公眾假期12:00‑23:00", "*11月21日（週六）營業時間為12:00-21:30（最後點餐時間 21:15） *12月24日（週四）12:30-23:00（最後點餐時間 22:45）", "交通：地鐵機場線「天神站」步行4分鐘；七隈線「天神南站」步行3分鐘；西鐵福岡（天神）站步行4分鐘", "適合：打卡巨型聖誕裝置、天神逛街順道到訪"]}]}}}}</script></body></html>
