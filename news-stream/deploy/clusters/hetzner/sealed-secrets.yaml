# Bitnami Sealed Secrets (Apache-2.0; chart 2.20.0 = controller 0.40.0): the cluster's only secret key. Secrets live in
# git as SealedSecrets, sealed to the controller's public cert (/infra/sealed-secrets.pem, `infra/seal.py`); the private
# key exists ONLY in this cluster (kube-system, label sealedsecrets.bitnami.com/sealed-secrets-key), with no cold copy
# (Deyao, 2026-10-21). A rebuilt cluster gets a new key: re-seal every Secret from the store `yyc`
# (`infra/seal.py --all`, cluster/README.md "Secrets after a rebuild").
#
# Key renewal is off (keyrenewperiod 0): the cert in the repo stays the one to seal with. Name and namespace are
# kubeseal's defaults (kube-system/sealed-secrets-controller). Memory request = limit, priority `serving` (never
# preempts a running job).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 24h
  url: https://bitnami.github.io/sealed-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 1h
  releaseName: sealed-secrets-controller
  targetNamespace: kube-system
  chart:
    spec:
      chart: sealed-secrets
      version: "2.20.0"
      sourceRef: {kind: HelmRepository, name: sealed-secrets}
  install: {crds: Create}
  upgrade: {crds: CreateReplace}
  values:
    fullnameOverride: sealed-secrets-controller
    keyrenewperiod: "0"
    # a new cluster's first start generates the 4096-bit key, which at 100m CPU outlasts the liveness probe's 30 s
    # (it restarted once on 2026-10-21): give startup up to 5 minutes
    startupProbe: {enabled: true, periodSeconds: 10, failureThreshold: 30}
    priorityClassName: serving
    resources:
      requests: {cpu: 100m, memory: 96Mi, ephemeral-storage: 64Mi}
      limits: {cpu: 100m, memory: 96Mi, ephemeral-storage: 64Mi}
---
# The FENCED applier. The SealedSecrets are applied by their own Flux Kustomizations (yyc-apps-secrets,
# yyc-aiwatch-secrets; flux-sync.yaml) as this ServiceAccount, which may ONLY manage SealedSecret objects in the app
# namespaces and db (the Postgres roles' passwords, the backup bucket's key): no Secrets, no RBAC, no pods, nothing cluster-wide. So a
# manifest pushed into a `sealed/` folder can't read a Secret or grant itself anything (a Role or a Pod there fails as
# Forbidden). Never drop serviceAccountName from those Kustomizations: without it they apply as kustomize-controller,
# i.e. cluster-admin. RoleBindings: yyc, mailmerge and db here, aiwatch in /ai-watch/deploy/sealed-secrets-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-applier
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-applier
rules:
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-applier
  namespace: yyc
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sealed-secrets-applier}
subjects: [{kind: ServiceAccount, name: sealed-secrets-applier, namespace: flux-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-applier
  namespace: mailmerge
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sealed-secrets-applier}
subjects: [{kind: ServiceAccount, name: sealed-secrets-applier, namespace: flux-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-applier
  namespace: db
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sealed-secrets-applier}
subjects: [{kind: ServiceAccount, name: sealed-secrets-applier, namespace: flux-system}]
