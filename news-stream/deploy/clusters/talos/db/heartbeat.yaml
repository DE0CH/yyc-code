# The heartbeat of YYC's two Postgres clusters and the watch over their primaries (pg-heartbeat/README.md; Deyao,
# 2026-11-09: restore tests, the industry standard; 2026-11-20: a redundant service must take over). Every 10 s one
# row, ops.heartbeat (src, at), is set to now() in pg's database app and in magpie-pg's database magpie. It travels
# with the WAL like any write, so:
# - a restore test recovered to time T must show ops.heartbeat.at shortly before T (../restore-test/);
# - a standby's copy of the row shows how far behind it is;
# - a primary that answers reads but commits nothing for 30 s has its Pod deleted (the Clusters' stopDelay: 60 then
#   ends it, and a standby takes over).
# Schema ops keeps it apart from each app's own schema and migrations. One replica: a missed beat during a pod move or
# a switchover only leaves a gap in its history.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-heartbeat
  namespace: db
spec:
  replicas: 1
  selector: {matchLabels: {app: pg-heartbeat}}
  template:
    metadata:
      labels: {app: pg-heartbeat}   # allowed in by pg-ingress and magpie-pg-ingress
    spec:
      serviceAccountName: pg-heartbeat
      securityContext: {runAsUser: 65532, runAsGroup: 65532, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      nodeSelector: {pool: apps}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: beat
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          image: pg-heartbeat
          args: [watch, "pg:app:app:PW_APP", "magpie-pg:magpie:magpie:PW_MAGPIE"]
          env:
            - {name: PW_APP, valueFrom: {secretKeyRef: {name: pg-role-app, key: password}}}
            - {name: PW_MAGPIE, valueFrom: {secretKeyRef: {name: pg-role-magpie, key: password}}}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
---
# The heartbeat's own account (pg-heartbeat/README.md): it reads the two Clusters' status and deletes the Pod of a
# primary that answers reads but commits nothing for 30 s (Deyao, 2026-11-20: a redundant service must take over).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-heartbeat
  namespace: db
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-heartbeat
  namespace: db
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [pg, magpie-pg]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pg-heartbeat
  namespace: db
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pg-heartbeat}
subjects:
  - {kind: ServiceAccount, name: pg-heartbeat, namespace: db}
