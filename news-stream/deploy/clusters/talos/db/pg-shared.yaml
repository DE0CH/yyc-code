# db/pg-shared: Cluster pg's primary under one name, pg-shared.db.svc.cluster.local:5432, which every database URL
# and JuiceFS metaurl in the cluster names (never pg-rw.db). YYC AI's sandbox hosts reach it from outside the
# cluster through the balancer's port 10.0.0.50:5432 and the pg-forward pods (yyc-ai/deploy/hermit/pg-forward.yaml).
apiVersion: v1
kind: Service
metadata:
  name: pg-shared
  namespace: db
spec:
  type: ClusterIP
  selector: {cnpg.io/cluster: pg, cnpg.io/instanceRole: primary}
  ports: [{name: postgres, port: 5432, targetPort: 5432, protocol: TCP}]
