# db/pg-shared (DESIGN 15.5 B3, 15.8): the old cluster's Cluster pg under a name of this cluster. Selector-less, with a
# manual EndpointSlice to pg-hosts' NodePort on yyc-pool-db-worker1 (10.0.0.2:30432, externalTrafficPolicy Local on
# the old side), so every database URL and JuiceFS metaurl of the new stack names pg-shared.db.svc.cluster.local:5432
# and no component names a cluster. NodePort 30433 (Cluster): the new fabric's AWS hosts reach the JuiceFS metadata
# at <gateway node's private IP>:30433 over wg0; kube-proxy forwards and masquerades it to 10.0.0.2:30432, so the old
# pg-ingress sees a node address (its 10.0.0.0/16 rule).
#
# T5 (after A6; the builder's CloudNativePG replica cluster pg promoted here): ONE commit sets
# `selector: {cnpg.io/cluster: pg, cnpg.io/instanceRole: primary}` and `targetPort: 5432`, and deletes EndpointSlice
# pg-shared-manual (the EndpointSlice controller leaves a foreign slice alone, so a selector alone would spread
# connections over the demoted old primary and the new one). Check right after: `kubectl -n db get endpointslices -l
# kubernetes.io/service-name=pg-shared` lists exactly one ready address, the new primary's pod on 5432.
apiVersion: v1
kind: Service
metadata:
  name: pg-shared
  namespace: db
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector: {cnpg.io/cluster: pg, cnpg.io/instanceRole: primary}
  ports: [{name: postgres, port: 5432, targetPort: 5432, nodePort: 30433, protocol: TCP}]
---
# db/pg-hosts: YYC AI's sandbox hosts' JuiceFS metadata (and hermit's juicefs CLI, same URL) reach Cluster pg at one
# fixed address, 10.0.0.51:5432 in network yyc: a Hetzner load balancer of its own (lb11, private network only;
# hcloud-ccm allows one Service per balancer, so the proxy's balancer yyc-ai-egress cannot carry it). The sandbox
# gateway only passes packets (yyc-ai README "Sandboxes"): the hosts' path to the database is not one of its jobs.
# externalTrafficPolicy Local over the database nodes: only the node that runs the primary passes the balancer's
# health check, so the path is balancer -> the primary's own node -> the primary, through no third node. The
# database sees the balancer's address (pg-ingress-nodes admits it on 5432); each role still needs its password.
# disable-private-ingress: without it kube-proxy on every node claims 10.0.0.51 and, having no local endpoint,
# drops what is routed through that node (yyc-ai egress-lb, 2026-11-16).
apiVersion: v1
kind: Service
metadata:
  name: pg-hosts
  namespace: db
  annotations:
    load-balancer.hetzner.cloud/name: yyc-pg-hosts
    load-balancer.hetzner.cloud/type: lb11
    load-balancer.hetzner.cloud/location: fsn1
    load-balancer.hetzner.cloud/use-private-ip: "true"
    load-balancer.hetzner.cloud/disable-public-network: "true"
    load-balancer.hetzner.cloud/private-ipv4: 10.0.0.51
    load-balancer.hetzner.cloud/disable-private-ingress: "true"
    load-balancer.hetzner.cloud/node-selector: pool=db
    load-balancer.hetzner.cloud/health-check-interval: 5s
    load-balancer.hetzner.cloud/health-check-timeout: 3s
    load-balancer.hetzner.cloud/health-check-retries: "2"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: true
  selector: {cnpg.io/cluster: pg, cnpg.io/instanceRole: primary}
  ports: [{name: postgres, port: 5432, targetPort: 5432, protocol: TCP}]
