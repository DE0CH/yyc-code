# The Sealed Secrets fence on yyc-talos (DE0CH/aviary yyc/refactor DESIGN 15.2 N9, deploy-workflows 6.4 step 2): yyc-ai.yml applies
# a sealed folder AS ServiceAccount yyc-deploy/sealed-secrets-applier, which may manage SealedSecrets and nothing else,
# so a push into DE0CH/aviary yyc/deploy/sealed/ cannot create RBAC or Pods or read a Secret. The controller is the add-on
# (addons/sealed-secrets.values.yaml, cert infra/sealed-secrets-talos.pem). The deployer may impersonate the fence
# (./yyc-ai-access.yaml); the fence is bound only where yyc-ai.yml writes SealedSecrets. This folder's own sealed/ is
# applied by the cluster's own apply, not through the fence.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-applier
  namespace: yyc-deploy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-applier
rules:
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-applier
  namespace: yyc-ai
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sealed-secrets-applier}
subjects: [{kind: ServiceAccount, name: sealed-secrets-applier, namespace: yyc-deploy}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-applier
  namespace: yyc-ai-fabric
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sealed-secrets-applier}
subjects: [{kind: ServiceAccount, name: sealed-secrets-applier, namespace: yyc-deploy}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-applier
  namespace: yyc-deploy
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sealed-secrets-applier}
subjects: [{kind: ServiceAccount, name: sealed-secrets-applier, namespace: yyc-deploy}]
