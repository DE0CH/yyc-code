# The db nodes of yyc-talos (../pg/pg.yaml): yyc-talos-db1..3 (cpx42, x86, fsn1)
# rebuilt into Talos, keeping their primary IPv6. Rendered as the news nodes are (./news.yaml: a worker with a public
# interface and its own WARP, without patches/worker.yaml's labels yyc.hetzner/network and pool=apps, so neither YYC
# AI's pods nor the JuiceFS node plugin come here), with this patch instead of news.yaml: only Cluster pg's instances
# (which tolerate the taint) and the per-node DaemonSets run there, one instance of 6 Gi + its 128 Mi sidecar per 8 GB
# node. talos.sh and patches/ are the builder's (plan "What the builder adds"). Checked with `talosctl validate --mode
# cloud` (v1.14.5) on a generated worker config patched with it, 2026-11-05.
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  pool: db
taints:
  dedicated: db:NoSchedule
