# SealedSecrets of yyc-talos's Cluster pg (T5), sealed to infra/sealed-secrets-talos.pem by infra/seal.py (it lists
# each file here): the role passwords, and the old cluster's streaming_replica certificate and CA (until T5-ha).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pg-role-feishu-index.yaml
  - pg-k3s-ca.yaml
  - pg-k3s-replication.yaml
  - pg-role-tools.yaml
  - pg-role-egress.yaml
  - pg-role-hermit.yaml
  - pg-role-aiwatch.yaml
  - pg-role-juicefs.yaml
  - pg-role-mcp.yaml
  - pg-role-readonly.yaml
  - pg-role-edge.yaml
  - pg-role-app.yaml
