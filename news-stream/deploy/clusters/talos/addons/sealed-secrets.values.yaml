# As ../../hetzner/sealed-secrets.yaml (chart 2.20.0 = controller 0.40.0); this cluster's own key (DESIGN 15.2 N6:
# public cert in infra/sealed-secrets-talos.pem). Runs on the control nodes, which keep their taint.
fullnameOverride: sealed-secrets-controller
keyrenewperiod: "0"
priorityClassName: serving
resources:
  limits: {cpu: 100m, ephemeral-storage: 64Mi, memory: 96Mi}
  requests: {cpu: 100m, ephemeral-storage: 64Mi, memory: 96Mi}
startupProbe: {enabled: true, failureThreshold: 30, periodSeconds: 10}
tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
