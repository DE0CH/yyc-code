            - name: ISP_PROXY
              valueFrom:
                secretKeyRef:
                  name: isp-proxy
                  key: ISP_PROXY
            resources:
              requests:
                cpu: 100m
                memory: 1024Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: '2'
                memory: 1024Mi
                ephemeral-storage: 5Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
          priorityClassName: batch
