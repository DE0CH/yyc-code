            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          imagePullSecrets:
          - name: ghcr-pull
          restartPolicy: Never
          containers:
          - name: cache
            image: yyc-news-stream
            # a shell is PID 1, not xvfb-run: as PID 1 xvfb-run never gets Xvfb's ready signal and hangs until the
            # deadline (every browser job failed from the move to the cluster, 2026-10-13, to 2026-10-14). "; exit $?"
            # stops dash from exec-ing the command in place of itself.
            command:
            - sh
            - -c
            - 'xvfb-run -a -s "-screen 0 1280x900x24" python /app/cache_fetch.py; exit $?'
            envFrom:
            - secretRef:
                name: app-env
            env:
            - name: ISP_PROXY  # cache_fetch.ISP_HOSTS: YYC's IPRoyal ISP IP (one client at a time, lock 'yyc youtube')
              valueFrom:
                secretKeyRef:
                  name: isp-proxy
                  key: ISP_PROXY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            resources:
              requests:
                cpu: 200m
                memory: 192Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: '2'
                memory: 1024Mi
                ephemeral-storage: 3Gi
            volumeMounts:
            - name: data
              mountPath: /var/lib/yyc/data
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: data
            emptyDir:
              sizeLimit: 512Mi
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi
          priorityClassName: batch
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fulltext
  namespace: yyc
  annotations:
    yyc/what: "article text of every news post without one (search: 搜尋), newest first, then the backfilled archive; every 30 min"
spec:
  schedule: 22,52 * * * *
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1740
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: fulltext
        spec:
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          imagePullSecrets:
          - name: ghcr-pull
          restartPolicy: Never
          # memory 2 Gi: its peak 1212 Mi (cgroup memory.peak, kv jobpeak:fulltext, 21 Oct) in 1536
          containers:
          - name: fulltext
            image: yyc-news-stream
            # a shell is PID 1, not xvfb-run: as PID 1 xvfb-run never gets Xvfb's ready signal and hangs until the
            # deadline (every browser job failed from the move to the cluster, 2026-10-13, to 2026-10-14). "; exit $?"
            # stops dash from exec-ing the command in place of itself.
            command:
            - sh
            - -c
            - 'xvfb-run -a -s "-screen 0 1280x900x24" python /app/fulltext_fetch.py; exit $?'
            envFrom:
            - secretRef:
                name: app-env
            env:
            - name: ISP_PROXY  # cache_fetch.ISP_HOSTS: YYC's IPRoyal ISP IP (one client at a time, lock 'yyc youtube')
              valueFrom:
                secretKeyRef:
                  name: isp-proxy
                  key: ISP_PROXY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            # memory, measured 2026-10-14 (run 15:22 UTC, one tab over each 25-page browser batch): 1.12 GiB peak, one
            # renderer 494 MB; two runs OOMKilled at 1500Mi. Each page now has its own tab (closed after); the
            # limit leaves room for a heavy page all the same (never throttle work to fit)
            resources:
              requests:
                cpu: 300m
                memory: 1280Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: '2'
                memory: 2Gi
                ephemeral-storage: 3Gi
            volumeMounts:
            - name: data
              mountPath: /var/lib/yyc/data
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: data
            emptyDir:
              sizeLimit: 512Mi
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi
          priorityClassName: batch
---
