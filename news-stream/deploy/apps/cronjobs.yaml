apiVersion: batch/v1
kind: CronJob
metadata:
  name: broadcast
  namespace: yyc
  annotations:
    yyc/what: TV/radio news programmes transcribed to text (broadcast_fetch.py with media.py's model; YouTube bulletins through the ISP IP; README "TV and radio"); hourly at :20
spec:
  schedule: 20 * * * *
  timeZone: Etc/UTC
  suspend: true  # off (Deyao, 2026-10-20: cost; flag `transcription` off too: broadcast_fetch.run files nothing)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: broadcast
        spec:
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          imagePullSecrets:
          - name: ghcr-pull
          restartPolicy: Never
          containers:
          - name: broadcast
            image: yyc-news-stream
            command:
            - python
            - /app/broadcast_fetch.py
            envFrom:
            - secretRef:
                name: app-env
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            - name: BC_RUN_SECONDS
              value: "2700"
            - name: FLAGD_HOST  # flag transcription: files nothing while off (broadcast_fetch.run)
              value: flagd.yyc.svc.cluster.local
            # YouTube through YYC's IPRoyal ISP IP (media.py MEDIA_ROUTES; one client at a time: media.youtube_lock)
            - name: MEDIA_ROUTES
