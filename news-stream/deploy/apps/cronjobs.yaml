# One CronJob per former systemd timer of infra/provision.sh: same script, schedule, TimeoutStartSec (as
# activeDeadlineSeconds) and MemoryMax. CPU requests at about half the measured peak (kubectl top, 21 Oct 2026: sites 856m,
# facebook 706m, browser 653m, forums 581m, sites-browser 574m, fulltext 523m), so the scheduler spreads them over nodes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: browser
  namespace: yyc
  annotations:
    yyc/what: 成報, 亞洲週刊, 明報月刊 through a real browser (Cloudflare challenge); was yyc-browser.timer, every 30 min
spec:
  schedule: 14,44 * * * *
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: browser
        spec:
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          imagePullSecrets:
          - name: ghcr-pull
          restartPolicy: Never
          containers:
          - name: browser
            image: yyc-news-stream
            # a shell is PID 1, not xvfb-run: as PID 1 xvfb-run never gets Xvfb's ready signal and hangs until the
            # deadline (every browser job failed from the move to the cluster, 2026-10-13, to 2026-10-14). "; exit $?"
            # stops dash from exec-ing the command in place of itself.
            command:
            - sh
            - -c
            - 'xvfb-run -a -s "-screen 0 1280x900x24" python /app/browser_fetch.py; exit $?'
            envFrom:
            - secretRef:
                name: app-env
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            resources:
              requests:
                cpu: 300m
                memory: 960Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: '2'
                memory: 1536Mi
                ephemeral-storage: 3Gi
            volumeMounts:
            - name: data
              mountPath: /var/lib/yyc/data
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: data
            emptyDir:
              sizeLimit: 512Mi
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi
          priorityClassName: batch
---
