# The picture scorer (python images.py run, README "Pictures"): finds the pictures of new posts (pages the readers
# handed over, or read here) and scores each once for meaning, 串流's items and the newest posts first. One copy works
# at a time, handed over without a gap: the new pod waits on the Postgres lock 'yyc images' while the old one, on
# SIGTERM, finishes the pictures in hand and exits (podlock.py, images.on_term). A copy whose lock's connection was cut
# and the lock taken by another stops within seconds (tests/test_worker_locks.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: images
  namespace: yyc
spec:
  replicas: 0  # off (Deyao, 2026-10-20: cost; flag `pictures` off too, images.on): 1 + the flag on turns it back on
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: images}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata:
      labels: {app: images}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      imagePullSecrets: [{name: ghcr-pull}]
      terminationGracePeriodSeconds: 300
      containers:
        - name: images
          image: yyc-news-stream
          command: [python, /app/images.py, run]
          # app-env: OPENROUTER_API (key yyc-stream), DISCORD_WEBHOOK (notify.py: OpenRouter's limit or credit refusal)
          envFrom: [{secretRef: {name: app-env}}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: db-app, key: uri}}}
            - {name: DB_POOL_MAX, value: "8"}
            - {name: FLAGD_HOST, value: flagd.yyc.svc.cluster.local}  # flag pictures: scores nothing while off (images.on)
            # glibc: big picture buffers always mmap'd and handed back when freed (the dynamic threshold kept them in a
            # fragmented heap: 314 MB held between pictures, 2026-10-15; README "Pictures", Memory)
            - {name: MALLOC_MMAP_THRESHOLD_, value: "1048576"}
          readinessProbe: {exec: {command: [test, -f, /tmp/images-started]}, periodSeconds: 2}
          livenessProbe:
            exec: {command: [sh, -c, "test -n \"$(find /tmp/images-alive -mmin -3)\""]}
            initialDelaySeconds: 60
            periodSeconds: 30
          # memory (README "Pictures", Memory): decoding is held inside images.DECODE_BUDGET (256 MB); measured on 298 real
          # pictures, 6 threads: +240 MB peak over the process. Worst case: ~60 MB process + 256 MB decodes + 6 downloads
          # in flight (<= 20 MB each) + encoding ~ 450 MB; the limit leaves twice that. Was 768Mi: OOMKilled 5 times on
          # 60-megapixel JPEGs decoded in full (2026-10-15).
          resources:
            requests:
              cpu: 100m
              memory: 1024Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: '1'
              memory: 1024Mi
              ephemeral-storage: 1Gi
      priorityClassName: serving
