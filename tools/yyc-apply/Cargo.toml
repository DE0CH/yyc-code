[package]
name = "yyc-apply"
version = "0.1.0"
edition = "2024"
publish = false
description = "YYC's deploy applier: render, plan against the live state, deletion gate, ordered server-side apply, rollout waits, prune, inventory (deploy-workflows.md 6)"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "0.9"

[profile.release]
strip = "symbols"
