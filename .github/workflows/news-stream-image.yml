# Builds the YYC news stream image (news-stream/Dockerfile) on every push touching news-stream/ and pins its tag in
# news-stream/deploy/apps/kustomization.yaml, then starts yyc-apps.yml, which rolls it out on yyc-talos (a push made
# with GITHUB_TOKEN starts no workflow, so the deploy is dispatched explicitly). This workflow never touches the cluster. Never force-pushes: on a race it re-applies the
# pin onto the newest main and pushes again.
name: news-stream-image
on:
  push:  # every branch (the gate merges a branch when this is green); main alone pins and deploys
    paths:
      - news-stream/**
      - '!news-stream/deploy/**'
      - '!news-stream/web-app/**'   # the site: its own workflow (web-app.yml), not in the image
      - '!news-stream/edge/**'
      - '!news-stream/mcp-edge/**'   # yyc-mcp: its own image (mcp-image.yml)
      - '!news-stream/**.md'
      - news-stream/briefs/**   # the scorer's background briefs: .md, but in the image
      - .github/workflows/news-stream-image.yml
  workflow_dispatch:
    inputs:
      ref:
        description: "build this branch/commit instead of main (no pin: e.g. a branch's image ahead of its merge)"
        required: false
        default: ""
concurrency:
  group: "news-stream-image-${{ github.ref }}"
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
  actions: write     # dispatch yyc-apps.yml after the pin
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'merge' || '' }}   # main: the main-only push key (gate setup)
    env:
      IMAGE: ghcr.io/de0ch/yyc-news-stream
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: "${{ secrets.MERGE_DEPLOY_KEY }}"   # empty on a branch: the workflow token
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: S=$(git rev-parse HEAD); echo "tag=${S::12}" >> "$GITHUB_OUTPUT"; echo "sha=$S" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: news-stream
          file: news-stream/Dockerfile
          push: true
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ inputs.ref == '' && github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run --rm "$IMAGE:${{ steps.meta.outputs.tag }}" python -c "import app, web, reports, corpus, insights; print('imports ok')"
          docker run --rm "$IMAGE:${{ steps.meta.outputs.tag }}" google-chrome --version
      - name: pin the tag and deploy it
        if: ${{ !inputs.ref && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "news-stream-image bot"; git config user.email "actions@users.noreply.github.com"
          F=news-stream/deploy/apps/kustomization.yaml
          for attempt in 1 2 3 4 5 6; do
            # a main we cannot read fails the step: a fetch skipped here left the previous try's unpushed pin in place, which
            # then read as "already pinned" and the run went green with no pin (a deploy key replaced mid-run, 2026-11-19)
            git fetch -q origin main || { echo "::error::cannot read main (its deploy key?)"; exit 1; }
            git reset -q --hard origin/main
            # never move the pin backwards: a newer build may have pinned already
            CUR=$(news-stream/deploy/pin-image.py yyc-news-stream)  # this image's pin only: the others have their own
            if [ "$CUR" != unset ] && git cat-file -e "$CUR^{commit}" 2>/dev/null && git merge-base --is-ancestor "${{ steps.meta.outputs.sha }}" "$CUR" && [ "$CUR" != "$TAG" ]; then
              echo "main already pins $CUR, newer than $TAG"; exit 0
            fi
            # quoted: an all-digit sha prefix (696243023647, 22 Oct 2026) is a YAML number, and kustomize refuses it
            news-stream/deploy/pin-image.py yyc-news-stream "$TAG"
            git add "$F"
            git diff --cached --quiet && { echo "already pinned"; exit 0; }
            git commit -q -m "news-stream: pin image $TAG [skip ci]"
            if git push -q origin HEAD:main; then
              # GitHub can still resolve main to the commit before the pin for a few seconds after the push (2026-11-11:
              # the dispatched apply ran on the parent and the pin waited 3 h for the scheduled run): dispatch once main has it
              PIN=$(git rev-parse HEAD)
              for w in $(seq 1 30); do
                case $(gh api "repos/$GITHUB_REPOSITORY/compare/$PIN...main" --jq .status 2>/dev/null) in identical|ahead) break;; esac
                sleep 2
              done
              gh workflow run yyc-apps.yml --ref main -R "$GITHUB_REPOSITORY" && echo "dispatched yyc-apps.yml"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
