# yyc-socks' image (socks/, DaemonSet egress/socks on both clusters: news-stream/deploy/apps/socks.yaml on the old
# one, news-stream/deploy/clusters/talos/socks.yaml on yyc-talos, whose workers are ARM). Each architecture is built
# natively on its own runner (the image's build runs the unit tests) and its container tested there as a SOCKS5 and an
# HTTP proxy (a name through it, a refused private address); then one multi-arch tag, pinned in
# deploy/apps/kustomization.yaml (Flux) and clusters/talos/kustomization.yaml (talos-cluster.yml) by pin-image.py
# (this image's entry only), never moving back to an older commit.
name: socks-image
on:
  push:  # every branch (the gate merges a branch when this is green); main alone pins
    paths:
      - socks/**
      - '!socks/**.md'
      - .github/workflows/socks-image.yml
  workflow_dispatch:
concurrency:
  group: "socks-image-${{ github.ref }}"
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
env:
  IMAGE: ghcr.io/de0ch/yyc-socks
jobs:
  build:
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: S=$(git rev-parse HEAD); echo "tag=${S::12}" >> "$GITHUB_OUTPUT"; echo "sha=$S" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: socks
          platforms: linux/${{ matrix.arch }}
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=socks-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=socks-${{ matrix.arch }}
      - name: test the container as a proxy
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
        run: |
          set -e
          docker run -d --name socks --network host -e HOST_IP=127.0.0.1 -e DEFAULT_DNS=1.1.1.1,8.8.8.8 "$REF"
          for i in $(seq 30); do curl -sf localhost:1081/healthz && break; sleep 1; done
          # a name through the proxy (the runner has IPv4 only; IPv6 fails over to it)
          test "$(curl -s -m 20 -o /dev/null -w '%{http_code}' --socks5-hostname 127.0.0.1:1080 https://github.com/)" = 200
          # a private address and the runner's own loopback are refused (curl: 97 = proxy handshake error)
          ! curl -s -m 10 --socks5-hostname 127.0.0.1:1080 http://169.254.169.254/ -o /dev/null
          ! curl -s -m 10 --socks5-hostname 127.0.0.1:1080 http://localhost:1081/healthz -o /dev/null
          # the same port as an HTTP proxy: CONNECT, an absolute-form request, a refusal with its reason
          test "$(curl -s -m 20 -o /dev/null -w '%{http_code}' -x http://127.0.0.1:1080 https://github.com/)" = 200
          test "$(curl -s -m 20 -o /dev/null -w '%{http_code}' -x http://127.0.0.1:1080 http://example.com/)" = 200
          curl -s -m 10 -D - -o /dev/null -x http://127.0.0.1:1080 http://169.254.169.254/ | grep -q 'X-Yyc-Socks-Refusal: address'
          curl -s localhost:1081/metrics | grep 'yyc_socks_refused_total{reason="address"} 3'
          docker logs socks | tail -5
          # FAMILIES=ipv4 (yyc-talos's workers): ready without IPv6, a name through it over IPv4
          docker rm -f socks >/dev/null
          docker run -d --name socks4 --network host -e HOST_IP=127.0.0.1 -e FAMILIES=ipv4 -e DEFAULT_DNS=1.1.1.1,8.8.8.8 \
            -e SANDBOX_DNS=1.1.1.2,1.0.0.2,9.9.9.9,149.112.112.112 "$REF"
          for i in $(seq 30); do curl -sf localhost:1081/readyz && break; sleep 1; done
          curl -s localhost:1081/readyz | grep -q 'ipv6 not used'
          test "$(curl -s -m 20 -o /dev/null -w '%{http_code}' --socks5-hostname 127.0.0.1:1080 https://github.com/)" = 200
          curl -s localhost:1081/metrics | grep -q 'yyc_socks_connected_total{family="ipv6"} 0'
          # the sandbox profile asks its resolvers in order: Cloudflare for Families blocks the test name (Quad9 does not)
          for i in 1 2 3; do ! curl -s -m 10 -o /dev/null --socks5-hostname sandbox:x@127.0.0.1:1080 http://malware.testcategory.com/; done
          curl -s localhost:1081/metrics | grep -q 'yyc_socks_refused_total{reason="threat"} 3'
          docker logs socks4 | tail -5

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'merge' || '' }}   # main: the main-only push key (gate setup)
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: "${{ secrets.MERGE_DEPLOY_KEY }}" }   # empty on a branch: the workflow token
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: S=$(git rev-parse HEAD); echo "tag=${S::12}" >> "$GITHUB_OUTPUT"; echo "sha=$S" >> "$GITHUB_OUTPUT"
      - name: one multi-arch tag
        run: |
          T="$IMAGE:${{ steps.meta.outputs.tag }}"
          docker buildx imagetools create -t "$T" "$T-amd64" "$T-arm64"
          docker buildx imagetools inspect "$T"
      - name: pin the tag on both clusters
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "socks-image bot"; git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            # a main we cannot read fails the step: a fetch skipped here left the previous try's unpushed pin in place, which
            # then read as "already pinned" and the run went green with no pin (a deploy key replaced mid-run, 2026-11-19)
            git fetch -q origin main || { echo "::error::cannot read main (its deploy key?)"; exit 1; }
            git reset -q --hard origin/main
            changed=""
            for F in news-stream/deploy/apps/kustomization.yaml news-stream/deploy/clusters/talos/kustomization.yaml; do
              CUR=$(PIN_FILE=$F news-stream/deploy/pin-image.py yyc-socks)
              if [ "$CUR" != unset ] && git cat-file -e "$CUR^{commit}" 2>/dev/null && git merge-base --is-ancestor "${{ steps.meta.outputs.sha }}" "$CUR" && [ "$CUR" != "$TAG" ]; then
                echo "$F already pins $CUR, newer than $TAG"; continue
              fi
              PIN_FILE=$F news-stream/deploy/pin-image.py yyc-socks "$TAG"
              git add "$F"
            done
            git diff --cached --quiet && { echo "already pinned"; exit 0; }
            git commit -q -m "yyc-socks: pin image $TAG [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
