name: talos-cluster
# Applies yyc-talos's cluster-level folder news-stream/deploy/clusters/talos (its kustomization.yaml: namespaces, RBAC,
# YYC AI's access and fence, the deploy connector, etcd backups, the Descheduler, the folder's SealedSecrets) to the
# cluster (README "Applying"; yyc-ai/refactor DESIGN 15.3: the cluster's own workflow, never yyc-ai.yml). Not here:
# machine config (talos.sh gen/apply), Helm add-ons (talos.sh addons). The database folder db/ (magpie-pg, pg-shared;
# DESIGN 15.8) is applied here too, after the folder (its CloudNativePG objects need the operator's CRDs, an add-on).
#
# - The runner reaches the Kubernetes API through tunnel yyc-deploy (deploy-workflows.md 3; Access service token in
#   environment talos-cluster) and authenticates with its own GitHub OIDC token as gha:talos-cluster (the rule in
#   clusters/talos/patches/controlplane.yaml; cluster-admin by clusters/talos/cluster-access.yaml). No cluster
#   credential is stored in GitHub.
# - Every run shows `kubectl diff` first; mode apply (push, dispatch default) then runs `kubectl apply -k`
#   (server-side validation, no prune: an object removed from the folder is deleted by hand in the same task).
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, options: [apply, plan], default: apply}
  push:   # gha:talos-cluster is in the control nodes' authenticator (patches/controlplane.yaml, 2026-11-05)
    branches: [main]
    paths: [news-stream/deploy/clusters/talos/**, '!news-stream/deploy/clusters/talos/patches/**',
            '!news-stream/deploy/clusters/talos/nat/**', '!news-stream/deploy/clusters/talos/addons/**',
            .github/workflows/talos-cluster.yml, .github/actions/k8s-tools/**]
concurrency: {group: talos-cluster, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: talos-cluster                     # deployment branches: main only; holds the Access secrets
    permissions: {contents: read, id-token: write}
    env:
      D: news-stream/deploy/clusters/talos
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/k8s-tools
      - name: connect
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.YYC_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.YYC_DEPLOY_ACCESS_CLIENT_SECRET }}
          YYC_DEPLOY_CA: ${{ github.workspace }}/infra/yyc-talos-ca.pem
        run: tools/yyc-apply/connect.sh
      - name: diff
        run: |
          set +e
          kubectl diff -k "$D" > diff.txt 2>&1; code=$?
          kubectl diff -k "$D/db" >> diff.txt 2>&1; c2=$?; [ $c2 -le $code ] || code=$c2
          { echo '```diff'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; cat diff.txt
          # 0: no change, 1: changes, >1: an error, e.g. objects in a namespace this apply creates (diff cannot
          # show those); the apply below is the gate
          [ $code -le 1 ] || echo "::warning::kubectl diff exited $code (see above); applying anyway"
      - name: apply
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'apply'
        run: |
          set -euo pipefail
          kubectl apply -k "$D" > apply.txt
          kubectl apply -k "$D/db" >> apply.txt
          grep -v ' unchanged$' apply.txt || echo "nothing changed"
      - name: tell Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.YYC_DISCORD_WEBHOOK }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="yyc-talos cluster folder: the apply failed; the cluster may not match main. $url"
          [ -n "$WEBHOOK" ] && curl -s -X POST -H "Content-Type: application/json" -d "$(jq -n --arg c "$msg" '{content:$c}')" "$WEBHOOK" >/dev/null || true
