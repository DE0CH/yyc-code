name: yyc-ai
# YYC AI's deploy to the new Talos cluster (claude-env CLAUDE.md "GitOps runs in GitHub workflows"; yyc-ai/refactor
# deploy-workflows.md 5-6 and 12, DESIGN 15.3; tools/yyc-apply/README.md). check: every PR and push touching YYC AI.
# deploy: push to main, every 3 h (reverts drift), dispatch. The runner reaches the API through tunnel yyc-deploy
# (Access service token) and authenticates with its own GitHub OIDC token (the control nodes' authenticator,
# news-stream/deploy/clusters/talos/patches/controlplane.yaml): no cluster credential is stored anywhere in GitHub. The
# cluster started empty: the first run's plan is creates only, from an empty inventory.
#
# FOLDER is the new stack, yyc-ai/deploy/ (WP-39's promotion). Job `deploy` applies it on every push to main since
# deploy-workflows 12.5 step 5 (A1 step 3, 2026-11-05); a plan-mode dispatch still only plans.
on:
  push:
    branches: [main]
    paths: &paths
      - yyc-ai/deploy/**
      - news-stream/deploy/clusters/**
      - yyc-ai/tests/**
      - news-stream/deploy/db/**
      - infra/secrets.txt
      - infra/seal.py
      - infra/yyc-talos-ca.pem
      - infra/sealed-secrets-talos.pem
      - tools/yyc-apply/**
      - .github/actions/k8s-tools/**
      - .github/actions/yyc-apply/**
      - .github/workflows/yyc-ai.yml
  pull_request:
    paths: *paths
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      mode: {type: choice, options: [apply, plan], default: apply}
# concurrency is on job `deploy` only: a pull request's check never joins (and never cancels) a pending deploy. Group
# yyc-ai-deploy holds the main runs that apply (push, schedule, dispatch mode=apply); GitHub keeps one pending job per
# group and cancels the older, which only ever drops a run whose commits the newer one contains. A plan-only dispatch
# has its own group yyc-ai-plan, so it can never cancel a pending apply. A run holds the group for the apply's own
# waits (about 45 min at most).
#
# The applier's tests gate on its content, not on what an event changed: a marker in the Actions cache, keyed by the
# hash of tools/yyc-apply, .github/actions and this file, is saved only after the unit and kind tests passed at that
# content, and job deploy refuses to start without it. So a later push that touches only yyc-ai/deploy cannot carry an
# applier whose tests failed on an earlier push: its check runs them again (the marker is missing) and its deploy
# waits for them.
permissions: {contents: read}
env:
  FOLDER: yyc-ai/deploy
  SEALED: yyc-ai/deploy/sealed
  INVENTORY: yyc-deploy/inventory-yyc-ai
  NAMESPACES: yyc-ai,yyc-ai-fabric
  SEALED_AS: system:serviceaccount:yyc-deploy:sealed-secrets-applier
  # the deployer's rights and the fence's bindings on the new cluster (WP-59, deploy-workflows 12.3)
  ACCESS_FILES: news-stream/deploy/clusters/talos/yyc-ai-access.yaml news-stream/deploy/clusters/talos/sealed-secrets.yaml
  DEPLOY_APPLY: "yes"
  # kubeconform's schemas: Kubernetes' own, then the CRDs (SealedSecret, CloudNativePG, CiliumNetworkPolicy, ...)
  CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
jobs:
  # a schedule run re-applies main, whose items were checked on its push: it only makes sure the applier's tests passed
  # at this content (they run again when the marker is gone, e.g. evicted from the cache)
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: applier marker key
        id: marker
        run: echo "key=yyc-apply-tested-${{ hashFiles('tools/yyc-apply/**', '!tools/yyc-apply/target/**', '.github/actions/**', '.github/workflows/yyc-ai.yml') }}" >> "$GITHUB_OUTPUT"
      - name: applier tests passed at this content?
        id: tested
        uses: actions/cache/restore@v4
        with:
          path: .yyc-apply-tested
          key: ${{ steps.marker.outputs.key }}
          lookup-only: true
      - uses: ./.github/actions/k8s-tools
        with: {kind: "true"}
      - name: commits of this event
        if: github.event_name != 'schedule'
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$BASE..$SHA" ;;
            push) if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$SHA"; else range="$SHA~1..$SHA"; fi ;;
            *) range="" ;;
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "commits: ${range:-none}"
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: tools/yyc-apply}
      - uses: ./.github/actions/yyc-apply
      # spec-platform 13.3 items 1-8 and 13 (WP-31), 9-12 (yyc-apply check, WP-37), DESIGN 15.4-15.7
      - name: render and validate (item 1)
        run: |
          set -euo pipefail
          kustomize build "$FOLDER" > render.yaml
          yq ea -o=json -I=0 '[.]' render.yaml > render.json
          kubeconform -strict -summary -kubernetes-version 1.36.5 -schema-location default -schema-location "$CRDS" \
            render.yaml
          for d in news-stream/deploy/db news-stream/deploy/clusters/talos/db; do
            kustomize build "$d" | kubeconform -strict -summary -kubernetes-version 1.36.5 -schema-location default -schema-location "$CRDS"
          done
      - name: switches, zero-downtime shape, pins, policies, gateway config, placement, sizes, one cluster (2-4, 6, 8, 13)
        run: python3 yyc-ai/tests/check_deploy.py --folder "$FOLDER" --render render.json --online
      - name: every pinned image's commit passed its own CI (aviary ci, claudecodeui pigeon-app, jarvis3 chat)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 yyc-ai/tests/check_pins_green.py --folder "$FOLDER"
      - name: the checks catch their planted violations
        if: github.event_name != 'schedule'
        env: {RENDER: render.json}
        run: |
          set -euo pipefail
          python3 yyc-ai/tests/test_check_deploy.py
          python3 yyc-ai/tests/test_check_pins_green.py
          python3 yyc-ai/tests/test_seal.py
          python3 yyc-ai/tests/test_zdr_violations.py
          python3 yyc-ai/tests/test_openrouter_guardrail.py
          python3 yyc-ai/tests/test_system_prompt.py
          # bridges.sh against a real HAProxy (the bridge box's)
          sudo apt-get update -qq && sudo apt-get install -y -qq haproxy >/dev/null
          python3 yyc-ai/tests/test_bridges.py
      - name: sealed folders (item 5)
        run: python3 infra/seal.py --check --names-only --allow-unsealed
      # the catalogue is people's addresses: the secret YYC_CATALOGUE_JSON (the store's value, which the clusters'
      # Secrets are sealed from), never a file in git. A pull request from a fork has no secrets: nothing to check there
      - name: catalogue (item 7, the pinned hermit's own check)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CATALOGUE: ${{ secrets.YYC_CATALOGUE_JSON }}
        run: |
          set -euo pipefail
          [ -n "$CATALOGUE" ] || { echo "::error::the secret YYC_CATALOGUE_JSON is not set"; exit 1; }
          tag=$(yq '.images[] | select(.name == "hermit") | .newTag' "$FOLDER/kustomization.yaml")
          mkdir -p "$RUNNER_TEMP/hermit"
          crane export "ghcr.io/de0ch/hermit:$tag" - | tar -x -C "$RUNNER_TEMP/hermit" usr/local/bin/hermit
          (umask 077; printf '%s' "$CATALOGUE" > "$RUNNER_TEMP/catalogue.json")
          # hermit's words name the entry at fault: printed with every address masked
          code=0; "$RUNNER_TEMP/hermit/usr/local/bin/hermit" catalogue-check "$RUNNER_TEMP/catalogue.json" > "$RUNNER_TEMP/catalogue-check.txt" 2>&1 || code=$?
          sed -E 's/[A-Za-z0-9._%+-]*@[A-Za-z0-9.-]+/<address>/g' "$RUNNER_TEMP/catalogue-check.txt"
          rm -f "$RUNNER_TEMP/catalogue.json" "$RUNNER_TEMP/catalogue-check.txt"
          exit "$code"
      - name: the old cluster's pg-ingress only grows (DESIGN 15.5 B3)
        if: steps.range.outputs.range != ''
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python3 yyc-ai/tests/check_pg_ingress.py "${RANGE%%..*}" "${RANGE##*..}"
      - name: deployer rights, sealed folder, trailers, no cluster-level objects (9-12)
        if: github.event_name != 'schedule'
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          access=()
          for f in $ACCESS_FILES; do
            [ -f "$f" ] || { echo "::warning::$f does not exist yet (WP-59): items 9-12 not checked"; exit 0; }
            access+=(--access "$f")
          done
          yyc-apply check --folder "$FOLDER" --sealed "$SEALED" --namespaces "$NAMESPACES" --sealed-as "$SEALED_AS" \
            "${access[@]}" --secrets infra/secrets.txt ${RANGE:+--commits "$RANGE"}
      - name: cluster-level files of the deploy path
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          d=news-stream/deploy/clusters/talos
          files=$(ls "$d"/{yyc-ai-access,deploy-access,juicefs-csi}.yaml 2>/dev/null || true)
          [ -n "$files" ] || { echo "::warning::no deploy-path files in $d yet (WP-59)"; exit 0; }
          # shellcheck disable=SC2086
          kubeconform -strict -summary -kubernetes-version 1.36.5 -schema-location default -schema-location "$CRDS" $files
      - name: zero data retention guard
        if: github.event_name != 'schedule'
        run: python3 yyc-ai/tests/test_zdr.py
        env: {GITHUB_TOKEN: "${{ github.token }}"}
      - name: applier unit tests
        if: steps.tested.outputs.cache-hit != 'true'
        run: cargo test --release --locked --manifest-path tools/yyc-apply/Cargo.toml
      # deploy-workflows 6.6: prune gate, superset after a killed run, stale-run skip, SealedSecret wait, never-ready
      # rollout, field-ownership transfer, against a throwaway kind cluster (no YYC cluster, no credential)
      - name: applier tests against kind
        if: steps.tested.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          kind create cluster --name yyc-apply --wait 180s
          docker pull -q busybox:1.37.0 && kind load docker-image busybox:1.37.0 --name yyc-apply || echo "image not preloaded: the node pulls it"
          cargo test --release --locked --manifest-path tools/yyc-apply/Cargo.toml --test kind -- --ignored --test-threads 12
      - name: applier marker
        if: steps.tested.outputs.cache-hit != 'true'
        run: mkdir -p .yyc-apply-tested && echo "${{ github.sha }} ${{ github.run_id }}" > .yyc-apply-tested/tested
      - name: save the applier marker (only reached when both test steps passed)
        if: steps.tested.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .yyc-apply-tested
          key: ${{ steps.marker.outputs.key }}

  deploy:
    needs: check
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.check.result == 'success'
    runs-on: ubuntu-24.04
    # the apply's own waits stay under 45 min (header)
    timeout-minutes: 60
    concurrency:
      group: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'plan') && 'yyc-ai-plan' || 'yyc-ai-deploy' }}
      cancel-in-progress: false
    environment: yyc-ai                             # deployment branches: main only; holds the Access secrets
    permissions: {contents: read, id-token: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}                      # trailers since the last applied commit
      - name: applier marker key
        id: marker
        run: echo "key=yyc-apply-tested-${{ hashFiles('tools/yyc-apply/**', '!tools/yyc-apply/target/**', '.github/actions/**', '.github/workflows/yyc-ai.yml') }}" >> "$GITHUB_OUTPUT"
      - name: the applier's tests passed at this content
        uses: actions/cache/restore@v4
        with:
          path: .yyc-apply-tested
          key: ${{ steps.marker.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true
      - uses: ./.github/actions/k8s-tools
      - uses: ./.github/actions/yyc-apply
      - name: connect
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.YYC_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.YYC_DEPLOY_ACCESS_CLIENT_SECRET }}
        run: tools/yyc-apply/connect.sh
      - name: rights (N1, deploy-workflows 12.3)
        run: for ns in yyc-ai yyc-ai-fabric yyc-deploy yyc; do echo "== $ns"; kubectl auth can-i --list -n "$ns"; done
      - name: plan
        env:
          # a plan-only dispatch writes nothing, so another run's live inventory lease does not refuse it
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'plan') && '--force' || '' }}
        run: |
          set +e
          # shellcheck disable=SC2086
          yyc-apply plan --folder "$FOLDER" --sealed "$SEALED" --namespaces "$NAMESPACES" --inventory "$INVENTORY" \
            --sealed-as "$SEALED_AS" --run "${{ github.run_id }}" $FORCE --out plan.md > /dev/null; code=$?
          cat plan.md >> "$GITHUB_STEP_SUMMARY"; cat plan.md
          exit $code
      - name: apply
        if: env.DEPLOY_APPLY == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'apply')
        run: yyc-apply apply --plan plan.md --run "${{ github.run_id }}"

  # YYC Drive's edge (DE0CH/yyc-drive YYC-DRIVE.md "The edge"): the Worker yyc-drive on drive.yyc-internal.com, the
  # page and its settings at Cloudflare. It comes out of the image the kustomization pins (/srv/edge), so the page at
  # the edge and the server in the cluster are one yyc-drive commit; its settings are drive/edge.json. A Worker deploy
  # is atomic (requests in flight finish on the old version). Its route is news-stream/deploy/cloudflare/tofu/drive.tf.
  drive-edge:
    needs: check
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.check.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'apply')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency: {group: yyc-drive-edge, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the pinned edge
        run: |
          set -euo pipefail
          tag=$(yq '.images[] | select(.name == "yyc-drive") | .newTag' "$FOLDER/kustomization.yaml")
          echo "yyc-drive $tag"
          id=$(docker create "ghcr.io/de0ch/yyc-drive:$tag")
          docker cp "$id:/srv/edge" "$RUNNER_TEMP/edge"
          docker rm "$id" > /dev/null
      - name: deploy
        working-directory: ${{ runner.temp }}/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YYC_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YYC_CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          vars=()
          while IFS= read -r kv; do vars+=(--var "$kv"); done < <(jq -r 'to_entries[] | "\(.key):\(.value)"' "$GITHUB_WORKSPACE/$FOLDER/drive/edge.json")
          npx --yes wrangler@4.151.0 deploy "${vars[@]}"

  # the live site after an applying deploy (not the 3-hourly re-apply: each run boots a sandbox, maybe an AWS host): sign
  # in as bot@deyaochen.com by e-mailed code (bot-mail's /access-code, service token yyc-ai-e2e), /api/jarvis/me, one
  # chat turn answered by the model, the message box's list of slash commands (yyc-ai/tests/e2e/live_chat.py)
  e2e:
    needs: deploy
    if: >-
      always() && needs.deploy.result == 'success' && github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'apply')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency: {group: yyc-ai-e2e, cancel-in-progress: false}   # one Access code at a time
    steps:
      - uses: actions/checkout@v4
      - name: playwright
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q playwright==1.62.0
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium >/dev/null
      - name: the browser-free pieces
        run: python3 yyc-ai/tests/e2e/test_live_chat.py
      - name: sign in, one chat turn
        env:
          E2E_CODE_CLIENT_ID: ${{ secrets.E2E_CODE_CLIENT_ID }}
          E2E_CODE_CLIENT_SECRET: ${{ secrets.E2E_CODE_CLIENT_SECRET }}
        run: python3 yyc-ai/tests/e2e/live_chat.py "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: e2e-screens, path: "${{ runner.temp }}/e2e", if-no-files-found: ignore}

  # a red run on main (check, deploy or e2e), and the first good run after one, to YYC's Discord (as cloudflare.yml)
  tell:
    needs: [check, deploy, e2e, drive-edge]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {actions: read}
    steps:
      - name: tell Discord
        env:
          WEBHOOK: ${{ secrets.YYC_DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ (needs.check.result == 'failure' || needs.deploy.result == 'failure' || needs.e2e.result == 'failure' || needs['drive-edge'].result == 'failure') && 'failure' || 'success' }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/yyc-ai.yml/runs?branch=main&status=completed&per_page=2" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].conclusion" 2>/dev/null || echo unknown)
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" != success ]; then msg="YYC AI deploy: the run failed (check, deploy, the drive's edge or the live end-to-end); the cluster may not match main or the site may be broken. $url"
          elif [ "$prev" = failure ]; then msg="YYC AI deploy: runs succeed again. $url"
          else exit 0; fi
          [ -n "$WEBHOOK" ] && curl -s -X POST -H "Content-Type: application/json" -d "$(jq -n --arg c "$msg" '{content:$c}')" "$WEBHOOK" >/dev/null || true
