# YYC AI's zero-data-retention guard (yyc-ai/tests/test_zdr.py), on yyc-ai/deploy/egress/egress.json: every model
# staff can pick has a ZDR endpoint on OpenRouter, OpenRouter is reached only through jarvis3's forced-ZDR `model`
# route, and the pinned jarvis3 commit forces provider.zdr / data_collection deny into every request. Runs on every change to the shortlists or the pin,
# and daily (a provider can drop its ZDR endpoint; a failed run mails the repo owner).
name: yyc-ai-zdr
on:
  push:  # every branch: the gate merges a branch when this is green
    paths:
      - yyc-ai/**
      - .github/workflows/yyc-ai-zdr.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 yyc-ai/tests/test_zdr.py
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: python3 yyc-ai/tests/test_zdr_violations.py
