# The cluster tools of yyc-ai.yml, each by exact version and sha256 (a changed download fails the job). kind only when
# asked (the applier's tests in job check).
name: k8s-tools
description: kustomize, kubeconform, crane, kubectl, cloudflared, yq (and kind), pinned by version and sha256
inputs:
  kind:
    description: also install kind
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WITH_KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        B="$RUNNER_TEMP/k8s-tools"; mkdir -p "$B"; cd "$B"
        get() {  # name url sha256
          # 8 tries over up to 3 min: GitHub releases and dl.k8s.io answered 504 for minutes on 2026-11-09
          curl -fsSL --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors -o "$1" "$2"
          echo "$3  $1" | sha256sum -c --quiet -
        }
        get kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        get kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        get crane.tgz https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        get kubectl https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl 33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e
        get cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db
        get yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        if [ "$WITH_KIND" = true ]; then
          get kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        fi
        tar -xzf kustomize.tgz kustomize; tar -xzf kubeconform.tgz kubeconform; tar -xzf crane.tgz crane
        rm -f ./*.tgz; chmod +x ./*
        echo "$B" >> "$GITHUB_PATH"
