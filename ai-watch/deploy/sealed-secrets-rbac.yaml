# The fenced SealedSecret applier (news-stream/deploy/clusters/hetzner/sealed-secrets.yaml) may manage SealedSecrets in
# namespace aiwatch: Kustomization yyc-aiwatch-secrets applies ./sealed/ as it. SealedSecrets only, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-applier
  namespace: aiwatch
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sealed-secrets-applier}
subjects: [{kind: ServiceAccount, name: sealed-secrets-applier, namespace: flux-system}]
