# XcodeGen spec of the name-tag app (nametags/README.md). `xcodegen generate` writes NameTags.xcodeproj (not in git).
# Every file under NameTags/ is a source; Info.plist (INFOPLIST_FILE) carries the camera usage text for 掃描.
name: NameTags
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  RomanSearch:
    path: Packages/RomanSearch
targets:
  NameTags:
    type: application
    platform: iOS
    sources:
      - NameTags
    dependencies:
      - package: RomanSearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.yycnametags
        PRODUCT_NAME: NameTags
        INFOPLIST_FILE: NameTags/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
